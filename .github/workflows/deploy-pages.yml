name: Deploy Mary’s Songs to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "static/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read GitHub Pages URL configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Build and verify portable site
        run: npm run build:static

      - name: Upload portable site
        uses: actions/upload-artifact@v4
        with:
          name: marys-songs-static
          path: ./static
          include-hidden-files: true
          if-no-files-found: error

      - name: Build GitHub Pages site
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  save-static:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check deployed sources are still current
        id: current
        env:
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet "$DEPLOYED_SHA" HEAD -- . ':!static'; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Newer source changes exist. Their deployment will update static/."
          fi

      - name: Remove previous export
        if: steps.current.outputs.save == 'true'
        run: rm -rf static

      - name: Download portable site
        if: steps.current.outputs.save == 'true'
        uses: actions/download-artifact@v4
        with:
          name: marys-songs-static
          path: static

      - name: Save export in repository
        if: steps.current.outputs.save == 'true'
        env:
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          test -s static/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- static
          if git diff --cached --quiet; then
            echo "static/ is already up to date."
            exit 0
          fi
          git commit -m "chore: refresh portable static export for ${DEPLOYED_SHA}"
          git push origin HEAD:main
